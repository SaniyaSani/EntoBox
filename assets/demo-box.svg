<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="7" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer></filter>
    <linearGradient id="foam" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efe4ca"/><stop offset=".55" stop-color="#e6d4b2"/><stop offset="1" stop-color="#d8bd8e"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1600" height="1200" fill="#6b4a30"/>
  <rect x="55" y="55" width="1490" height="1090" rx="26" fill="#3f2c20" filter="url(#shadow)"/>
  <rect x="88" y="88" width="1424" height="1024" rx="12" fill="url(#foam)"/>
  <rect x="88" y="88" width="1424" height="1024" rx="12" filter="url(#noise)" opacity=".75"/>
  <g opacity=".28" fill="#765f42">
    <circle cx="210" cy="188" r="3"/><circle cx="415" cy="305" r="2"/><circle cx="1320" cy="245" r="3"/><circle cx="1080" cy="846" r="2"/><circle cx="735" cy="1040" r="3"/><circle cx="275" cy="920" r="2"/><circle cx="1240" cy="1010" r="3"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#755f45" opacity=".55">
    <text x="120" y="1080" font-size="28">Demo box photograph · replace with a real top-down image</text>
    <text x="1370" y="1080" font-size="28">400 × 300 mm</text>
  </g>
</svg>
